[project]
name = "candy-paint-analysis"
version = "0.0.0"
description = "Audio analysis for the Candy Paint music video: beats, chords, sections, stems, notes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "librosa>=0.11",
  "numpy>=2.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "matplotlib>=3.9",
  "pretty-midi>=0.2.10"
]

[tool.uv]
package = false
